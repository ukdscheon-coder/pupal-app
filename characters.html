<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuPal Approved Characters</title>
<style>
body{margin:0;background:#faf6f0;font-family:system-ui;color:#273149}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:20px;max-width:900px;margin:auto}
.card{background:white;border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 20px #0001;animation:float 3s ease-in-out infinite}
.card img{width:100%;height:180px;object-fit:contain;border-radius:12px;background:#f2f1fb}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.note{padding:20px;text-align:center;max-width:700px;margin:auto}
a{color:#4e4a86}
</style>
</head>
<body>
<div class="note">
<h1>Approved PuPal Characters</h1>
<p>35 exact approved character images are loaded from <code>/assets/characters/</code>. They appear with floating animation. Full 3D GLB models go in the 3D viewer.</p>
<p><a href="/">Back to App</a> | <a href="/3d-viewer.html">3D Viewer</a></p>
</div>
<div class="gallery" id="gallery"></div>
<script>
const gallery=document.getElementById('gallery');
const characters=Array.from({length:35}, (_,i)=>`character${i+1}.jpg`);
characters.forEach((src,i)=>{
  const card=document.createElement('div');
  card.className='card';
  card.style.animationDelay=(i*0.1)+'s';
  card.innerHTML=`<img src="/assets/characters/${src}" alt="Approved character ${i+1}" onerror="this.style.display='none';this.parentElement.innerHTML='<p>Image not found<br><small>Add to /assets/characters/</small></p>'">
  <p>Character ${i+1}</p>`;
  gallery.appendChild(card);
});
</script>
</body>
</html>
