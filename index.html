<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<title>PuPal – Your School Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e7;--card:#ffffff;--accent:#ff6b6b;--accent2:#4ecdc4;--text:#2d3748;--muted:#667085;--parent:#4e4a86}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff8e7 0%,#e8f4ff 100%);font-family:'Nunito','Quicksand',system-ui,sans-serif;color:var(--text);min-height:100vh}
.app{max-width:480px;margin:auto;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.logo{font-weight:800;font-size:1.4rem;color:var(--parent)}
.tabs{display:flex;background:#fff;border-radius:20px;padding:4px;margin:12px 0;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:16px;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s}
.tabs button.selected{background:var(--accent);color:white}
.panel{background:var(--card);border-radius:28px;padding:20px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.07)}
h1,h2{margin:0 0 8px}
.kid-hero{text-align:center;padding:20px 0}
.kid-hero .char{font-size:4rem;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
button.big{background:var(--accent2);color:white;border:0;border-radius:20px;padding:16px;font-size:1.1rem;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
button.big:active{transform:scale(.98)}
.mission{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
.mission:last-child{border:0}
.progress{height:12px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#4ecdc4,#44a08d);width:0;transition:.4s}
input,select{width:100%;padding:12px;border-radius:14px;border:1px solid #ddd;font:inherit;margin:6px 0}
.muted{color:var(--muted);font-size:.9rem}
.footer{text-align:center;padding:20px 0;font-size:.85rem}
.footer a{color:var(--parent);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">PuPal</div>
    <select id="locale" style="width:auto;padding:8px 12px;border-radius:12px">
      <option value="en-GB">English (UK)</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
    </select>
  </div>
  <p id="subtitle" class="muted" style="text-align:center;margin:0 0 12px"></p>
  <div class="tabs">
    <button id="kidTab">Kid Mode</button>
    <button id="parentTab">Parent Mode</button>
  </div>
  <div id="view"></div>
  <div class="footer">
    <a href="/characters.html">Meet the Friends</a> &nbsp;•&nbsp; <a href="/3d-viewer.html">3D Viewer</a><br>
    <small id="privacy"></small>
  </div>
</div>
<script>
const translations = {
  "en-GB": {
    subtitle: "Your little friend for every school day!",
    parent: "Parent Mode", kid: "Kid Mode",
    missions: "Today's Missions", placeholder: "e.g. Pack PE kit",
    add: "Add Mission", approve: "Approve", complete: "I did it!",
    approved: "Approved!", pending: "Waiting for parent", todo: "Not done yet",
    reward: "Family Reward", save: "Save", note: "Coins appear when parent approves.",
    today: "Today's Adventures", confirmed: "Approved", coins: "Coins",
    friend: "Your PuPal Friend", privacy: "Everything stays on this device."
  },
  "ko": {
    subtitle: "매일 학교를 함께하는 작은 친구!",
    parent: "부모 모드", kid: "아이 모드",
    missions: "오늘의 미션", placeholder: "예: 체육복 챙기기",
    add: "미션 추가", approve: "확인", complete: "다 했어!",
    approved: "확인 완료!", pending: "부모 확인 대기", todo: "아직 안 함",
    reward: "가족 보상", save: "저장", note: "부모가 확인하면 코인을 받아요.",
    today: "오늘의 모험", confirmed: "확인됨", coins: "코인",
    friend: "나의 PuPal 친구", privacy: "모든 정보는 이 기기에만 저장됩니다."
  }
};
const KEY='pupal-v3';
let locale = localStorage.getItem('locale') || 'en-GB';
let mode = 'kid';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {
  missions: [{id:1,title:'Pack school bag',done:false,approved:false},{id:2,title:'Reading time',done:false,approved:false}],
  coins: 0, reward: 'Family board game'
};
const t = k => (translations[locale]||translations['en-GB'])[k] || k;
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
function render(){
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('privacy').textContent = t('privacy');
  document.getElementById('kidTab').textContent = t('kid');
  document.getElementById('parentTab').textContent = t('parent');
  document.getElementById('kidTab').classList.toggle('selected', mode==='kid');
  document.getElementById('parentTab').classList.toggle('selected', mode==='parent');
  const approved = state.missions.filter(m=>m.approved).length;
  const view = document.getElementById('view');
  if(mode==='kid'){
    view.innerHTML = `<div class="panel kid-hero">
      <div class="char">🦊</div>
      <h2>${t('friend')}</h2>
      <p>${t('confirmed')}: ${approved} • ${state.coins} ${t('coins')}</p>
      <div class="progress"><div style="width:${Math.min(100,approved*25)}%"></div></div>
    </div>
    <div class="panel">
      <h2>${t('today')}</h2>
      ${state.missions.map(m=>`<div class="mission"><div><strong>${m.title}</strong><br><small class="muted">${m.approved?t('approved'):m.done?t('pending'):t('todo')}</small></div><button class="big" style="width:auto;padding:10px 16px" data-id="${m.id}" ${m.done?'disabled':''}>${t('complete')}</button></div>`).join('')}
    </div>
    <div class="panel"><h2>${t('reward')}</h2><p>${state.reward}</p></div>`;
  } else {
    view.innerHTML = `<div class="panel"><h2>${t('missions')}</h2>
      <input id="newMission" placeholder="${t('placeholder')}">
      <button class="big" id="addMission">${t('add')}</button>
      ${state.missions.map(m=>`<div class="mission"><div><strong>${m.title}</strong><br><small class="muted">${m.approved?t('approved'):m.done?t('pending'):t('todo')}</small></div><button class="big" style="width:auto;padding:10px 16px" data-id="${m.id}" ${!m.done||m.approved?'disabled':''}>${t('approve')}</button></div>`).join('')}
    </div>
    <div class="panel"><h2>${t('reward')}</h2>
      <input id="reward" value="${state.reward}">
      <button class="big" id="saveReward">${t('save')}</button>
      <p class="muted">${t('note')}</p></div>`;
  }
  document.querySelectorAll('[data-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const m = state.missions.find(x=>x.id==btn.dataset.id);
      if(mode==='kid') m.done=true;
      else if(m.done){ m.approved=true; state.coins+=10; }
      save(); render();
    };
  });
  const add = document.getElementById('addMission');
  if(add) add.onclick = ()=>{
    const v = document.getElementById('newMission').value.trim();
    if(v){ state.missions.push({id:Date.now(),title:v,done:false,approved:false}); save(); render(); }
  };
  const sr = document.getElementById('saveReward');
  if(sr) sr.onclick = ()=>{ state.reward = document.getElementById('reward').value; save(); render(); };
}
document.getElementById('kidTab').onclick = ()=>{mode='kid';render()};
document.getElementById('parentTab').onclick = ()=>{mode='parent';render()};
document.getElementById('locale').onchange = e=>{locale=e.target.value;localStorage.setItem('locale',locale);render()};
render();
</script>
</body>
</html>
