<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6f0"><title>PUPAL | Pupals & Friends</title><style>body{margin:0;background:#faf6f0;color:#273149;font-family:system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;padding:20px}h1{margin:6px 0}button,input{font:inherit}button{border:0;border-radius:15px;padding:12px;background:#e9e8f7;cursor:pointer}button.selected{background:#4e4a86;color:white}.tabs,.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.panel{background:white;border-radius:24px;padding:20px;margin:15px 0;box-shadow:0 5px 30px #32395b10}.muted{color:#667085}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}input{padding:11px;border-radius:10px;border:1px solid #ccd0d8;max-width:90%}.stage{background:#f2f1fb;border-radius:20px;padding:20px;text-align:center}.alert{background:#fff5e6;padding:12px;border-radius:12px}.progress{height:9px;background:#eee;border-radius:20px;overflow:hidden}.progress>div{background:#88bda6;height:100%;transition:width .2s}small{color:#687080}</style></head><body><main class="app"><small>PUPAL · PUPALS & FRIENDS</small><h1>함께 성장하는 친구</h1><p class="muted">학교 준비를 즐겁게, 가족의 하루를 가볍게.</p><div class="tabs"><button id="parentTab" class="selected">Parent Mode</button><button id="kidTab">Kid Mode</button></div><div id="view"></div><small>기능 검증용 로컬 MVP. 이 화면은 고품질 3D 캐릭터 완성본이 아닙니다. 부모와 자녀의 기기 간 동기화는 아직 지원하지 않습니다.</small></main><script>
const KEY='pupal-local-v1';const initial={missions:[{id:1,title:'내일 준비물 챙기기',done:false,approved:false},{id:2,title:'읽기 숙제',done:false,approved:false}],coins:0,nickname:'Momo',reward:'가족 보드게임 시간',notes:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial}catch{state=initial}let mode='parent';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const el=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){el('parentTab').classList.toggle('selected',mode==='parent');el('kidTab').classList.toggle('selected',mode==='kid');const completed=state.missions.filter(x=>x.approved).length;const list=state.missions.map(m=>'<div class="row"><div><b>'+escapeHtml(m.title)+'</b><br><small>'+(m.approved?'부모 확인 완료':m.done?'아이 완료 선언, 확인 대기':'진행 전')+'</small></div><button data-id="'+m.id+'" data-action="'+(mode==='parent'?'approve':'done')+'" '+((mode==='parent'&&!m.done)||m.approved?'disabled':'')+'>'+(mode==='parent'?'확인':'완료')+'</button></div>').join('');el('view').innerHTML=mode==='parent'?'<section class="panel"><h2>학교 미션 관리</h2><div class="buttons"><input id="newMission" maxlength="80" placeholder="예: 체육복 준비"><button id="addMission">추가</button></div>'+list+'</section><section class="panel"><h2>Family Reward</h2><input id="reward" maxlength="100" value="'+escapeHtml(state.reward)+'"><button id="saveReward">저장</button><p class="muted">아이의 완료 선언을 부모가 확인해야 코인이 지급됩니다.</p></section>':'<section class="panel"><h2>'+escapeHtml(state.nickname)+'의 오늘</h2><div class="stage"><h2>✨ Pupals & Friends</h2><p>승인된 3D 캐릭터는 제작 단계입니다.</p><p>확인된 미션 '+completed+'개 · '+state.coins+' Coins</p><div class="progress"><div style="width:'+Math.min(100,completed*20)+'%"></div></div></div>'+list+'</section><section class="panel"><h2>가족 보상</h2><p>'+escapeHtml(state.reward)+'</p><p class="muted">부모가 확인한 성취를 함께 축하해요.</p></section>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const m=state.missions.find(x=>x.id==b.dataset.id);if(b.dataset.action==='done'){m.done=true}else if(m.done&&!m.approved){m.approved=true;state.coins+=10}save();render()});if(mode==='parent'){el('addMission').onclick=()=>{const v=el('newMission').value.trim();if(!v)return;state.missions.push({id:Date.now(),title:v,done:false,approved:false});save();render()};el('saveReward').onclick=()=>{state.reward=el('reward').value.trim();save();render()}}}el('parentTab').onclick=()=>{mode='parent';render()};el('kidTab').onclick=()=>{mode='kid';render()};render();
</script></body></html>
