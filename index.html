const KEY='pupal-local-v2',LOCALE_KEY='pupal-locale';let locale=localStorage.getItem(LOCALE_KEY)||'en-GB';if(!translations[locale])locale='en-GB';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.missions))state={missions:[{id:1,title:translations[locale].default1,done:false,approved:false},{id:2,title:translations[locale].default2,done:false,approved:false}],coins:0,reward:translations[locale].defaultReward};let mode='parent';const el=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),t=k=>translations[locale][k],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"':'"',"'":'&#39;'}[c]));function render(){document.documentElement.lang=locale;el('locale').value=locale;el('languageLabel').textContent=t('language');el('subtitle').textContent=t('subtitle');el('privacy').textContent=t('privacy');el('viewerLink').textContent=t('model');el('parentTab').textContent=t('parent');el('kidTab').textContent=t('kid');el('parentTab').classList.toggle('selected',mode==='parent');el('kidTab').classList.toggle('selected',mode==='kid');const approved=state.missions.filter(m=>m.approved).length;const list=state.missions.map(m=>'<div class="row"><div><b>'+esc(m.title)+'</b><br><small>'+(m.approved?t('approved'):m.done?t('pending'):t('todo'))+'</small></div><button data-id="'+m.id+'" data-action="'+(mode==='parent'?'approve':'done')+'" '+((mode==='parent'&&!m.done)||m.approved?'disabled':'')+'>'+(mode==='parent'?t('approve'):t('complete'))+'</button></div>').join('');el('view').innerHTML=mode==='parent'?'<section class="panel"><h2>'+t('missions')+'</h2><div class="buttons"><input id="newMission" maxlength="80" placeholder="'+t('placeholder')+'"><button id="addMission">'+t('add')+'</button></div>'+list+'</section><section class="panel"><h2>'+t('reward')+'</h2><input id="reward" maxlength="100" value="'+esc(state.reward)+'"><button id="saveReward">'+t('save')+'</button><p class="muted">'+t('note')+'</p></section>':'<section class="panel"><h2>'+t('today')+'</h2><div class="stage"><h2>'+t('friend')+'</h2><p>'+t('unavailable')+'</p><p>'+t('confirmed')+': '+approved+' | '+state.coins+' '+t('coins')+'</p><div class="progress"><div style="width:'+Math.min(100,approved*20)+'%"></div></div></div>'+list+'</section><section class="panel"><h2>'+t('reward')+'</h2><p>'+esc(state.reward)+'</p></section>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const m=state.missions.find(x=>String(x.id)===b.dataset.id);if(b.dataset.action==='done'){m.done=true}else if(m.done&&!m.approved){m.approved=true;state.coins+=10}save();render()});if(mode==='parent'){el('addMission').onclick=()=>{const v=el('newMission').value.trim();if(!v)return;state.missions.push({id:Date.now(),title:v,done:false,approved:false});save();render()};el('saveReward').onclick=()=>{state.reward=el('reward').value.trim();save();render()}}}el('locale').onchange=e=>{locale=e.target.value;localStorage.setItem(LOCALE_KEY,locale);render()};el('parentTab').onclick=()=>{mode='parent';render()};el('kidTab').onclick=()=>{mode='kid';render()};render();
</script></body></html>
